# AI 模型配置文件
# 材料文本提取可选模型（1M 上下文窗口）

default_provider: mimo-v2.5-pro

# 视觉专家（图片分析专用，不出现在文本提取下拉框）
vision:
  provider: qwen3.6-flash        # 必须在 providers 中已配置；vision-only
  concurrency: 10               # 同时 in-flight 的看图请求数（信号量）
  batch_per_call: 3             # 单次 API 调用带的图片数（1~3 推荐）
  max_images_per_paper: 60      # 每篇最多分析的图片数
  max_retries: 3                # 429 / 超时退避重试次数

providers:
  deepseek-v4-flash-0731:
    label: deepseek-v4-flash-0731
    order: 1
    api_key_env: QWEN_API_KEY
    base_url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    models:
      chat: deepseek-v4-flash-0731
    context_window:
      chat: 1000000
    max_output: 131072

  deepseek-v4-pro:
    label: deepseek-v4-pro
    order: 2
    api_key_env: QWEN_API_KEY
    base_url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    models:
      chat: deepseek-v4-pro
    context_window:
      chat: 1000000
    max_output: 131072

  mimo-v2.5-pro:
    label: mimo-v2.5-pro
    order: 3
    api_key_env: MIMO_API_KEY
    base_url: https://token-plan-cn.xiaomimimo.com/v1
    models:
      chat: mimo-v2.5-pro
    context_window:
      chat: 1048576
    max_output: 131072

  # Vision-only provider: it is intentionally filtered from /api/models.
  qwen3.6-flash:
    label: qwen3.6-flash
    selectable: false
    order: 99
    api_key_env: QWEN_API_KEY
    base_url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    models:
      chat: qwen3.6-flash
    context_window:
      chat: 1000000
    max_output: 131072

# 提取参数
extraction:
  short_paper_threshold: 15000       # 字符数，以下全量投喂
  medium_paper_threshold: 100000     # 以下按 section 分块
  large_paper_threshold: 1500000     # 以下分层提取（仍可能全量）
  temperature: 0.1                   # 提取类任务低温度
  analysis_temperature: 0.3          # 分析类任务适中温度
  max_retries: 2                     # 重试次数

# 缓存
cache:
  enabled: true
  ttl_days: 30
  dir: library/cache
